name: Publish to PyPI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A push made with GITHUB_TOKEN does not start any workflow, so a release
      # PR merged with it lands on main and then nothing publishes. Using the
      # PAT keeps the chain alive and also lets CI run on the release PR.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.SDK_SYNC_PAT }}
          # No release-type input: with it, release-please-action v4 ignores
          # release-please-config.json (and its extra-files), which is how
          # 3.4.1 shipped with _version.py still at 3.4.0.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Merging the release PR here, from a push-triggered job, is what makes a
      # release land without a human. A pull_request-triggered workflow cannot
      # do it: GitHub holds runs on bot-authored PRs as action_required, and it
      # never starts CI on a PR the GITHUB_TOKEN opened, so waiting on checks
      # would wait forever.
      - name: Merge the release PR
        env:
          GH_TOKEN: ${{ secrets.SDK_SYNC_PAT }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          # The action's own output is authoritative and immediate. Listing by
          # label is not: the previous run created PR #61 at 00:14:03 and a
          # label query 3 seconds later still returned nothing, so the release
          # sat open.
          PR=$(printf '%s' "$RELEASE_PR" | jq -r '.number // empty' 2>/dev/null || true)

          if [ -z "$PR" ]; then
            for _ in 1 2 3; do
              PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label 'autorelease: pending' \
                --json number,author --jq '[.[] | select(.author.is_bot)] | .[0].number // empty')
              [ -n "$PR" ] && break
              sleep 5
            done
          fi

          if [ -z "$PR" ]; then
            echo "No pending release PR to merge."
            exit 0
          fi

          HEAD_SHA=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)

          # 4.0.0 merged a release PR whose __init__.py was a stale copy from
          # before the parity PR, dropping every export. A release PR may only
          # move version lines (and the changelog); anything else means its
          # content is stale, so stop and let the next push rebuild it.
          # shellcheck disable=SC2016 # $f is a jq variable, not a shell one
          unexpected=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$HEAD_SHA" --jq '
            .files[] | select(.filename != "CHANGELOG.md") | .filename as $f
            | (.patch // "@@ binary or too large") | split("\n")[]
            | select(test("^[-+@]") and (test("^@@ -[0-9]") | not))
            | select(test("^[-+][[:space:]]*(version = |__version__ = |\"[.]\": )") | not)
            | "\($f): \(.)"')
          if [ -n "$unexpected" ]; then
            echo "::error::release PR #$PR changes more than version lines; refusing to merge:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          # Never merge a release PR whose CI is red: 4.0.0 merged two seconds
          # after its type check failed. Checks take a moment to register.
          for _ in $(seq 1 12); do
            gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            [ "$?" -eq 8 ] && break
            sleep 10
          done
          gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --watch --fail-fast --interval 15

          echo "Merging release PR #$PR at $HEAD_SHA"
          gh pr merge "$PR" --squash --repo "$GITHUB_REPOSITORY" --match-head-commit "$HEAD_SHA"

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Check the version in every file matches the tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          want="${TAG##*v}"
          code=$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' src/blindpay/_version.py)
          meta=$(sed -nE 's/^version = "([^"]+)".*/\1/p' pyproject.toml)
          echo "tag=$want _version.py=$code pyproject=$meta"
          [ "$code" = "$want" ] && [ "$meta" = "$want" ] || { echo "::error::version mismatch, refusing to publish"; exit 1; }

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_USERNAME: __token__
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv publish