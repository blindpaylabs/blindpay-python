name: Type Check

on:
  workflow_call:

jobs:
  typecheck:
    name: Run type checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --locked --group dev --group test

      - name: Type check
        run: uv run pyright

      - name: Type check
        run: uv run mypy .

      - name: README snippets type-check (rendered by tests/test_readme_snippets.py)
        run: |
          uv run pyright tests/readme_snippets.py
          uv run mypy --strict tests/readme_snippets.py

